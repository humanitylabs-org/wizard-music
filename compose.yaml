services:
  music-init:
    image: ${MUSIC_IMAGE:-ghcr.io/humanitylabs-org/wizard-music:0.2.0-test.2}
    pull_policy: never
    user: '0:0'
    network_mode: none
    restart: 'no'
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ['no-new-privileges:true']
    read_only: true
    command: ['python3', '-c', 'import os; [(os.chown(p, 1000, 1000), os.chmod(p, 448)) for p in ("/data", "/music")]']
    volumes: [music-data:/data, music-library:/music]
  music:
    depends_on:
      music-init:
        condition: service_completed_successfully
    image: ${MUSIC_IMAGE:-ghcr.io/humanitylabs-org/wizard-music:0.2.0-test.2}
    pull_policy: never
    restart: unless-stopped
    ports: ['127.0.0.1:${MUSIC_PORT:-9205}:9205']
    environment:
      WIZARD_MUSIC_CONNECTORS_URL: ${WIZARD_MUSIC_CONNECTORS_URL:-}
      MUSIC_ADAPTER_TOKEN: ${MUSIC_ADAPTER_TOKEN:-}
      WIZARD_MUSIC_ONLINE: '0'
    volumes: [music-data:/data, music-library:/music:ro]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
volumes:
  music-data:
  music-library:
