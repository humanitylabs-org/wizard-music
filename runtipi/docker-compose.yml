services:
  wizard-music:
    # Published by .github/workflows/image.yml from 6b3c7352361b71a7dbff402f8714e19bf41614c7 (amd64 + arm64).
    image: ghcr.io/humanitylabs-org/wizard-music:sha-6b3c7352361b71a7dbff402f8714e19bf41614c7@sha256:d1cf28c8ae19ef1916a157125b41292b1917c2015afd152516d258fb841e2860
    restart: unless-stopped
    # start.py prepares /data as root, then drops to 1000:1000. No separate init container:
    # Runtipi reports an app with an exited container as stopped, which hid Music's icon link.
    ports: ['127.0.0.1:${APP_PORT:-9205}:9205']
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    environment:
      WIZARD_MUSIC_APP_HOST: 0.0.0.0
      WIZARD_MUSIC_APP_PORT: '9205'
      WIZARD_MUSIC_HUB_ORIGIN: http://127.0.0.1:8793
      WIZARD_MUSIC_CONNECTORS_URL: ${WIZARD_MUSIC_CONNECTORS_URL:-}
      MUSIC_ADAPTER_TOKEN: ${MUSIC_ADAPTER_TOKEN:-}
      WIZARD_MUSIC_SOURCES: wizard-youtube-music=http://wizard-youtube-music:9206
      WIZARD_MUSIC_HUB_HOME: /data
      WIZARD_MUSIC_LIBRARY: /music
      WIZARD_MUSIC_ONLINE: "0"
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/music:/music:ro
    x-runtipi:
      is_main: true
      internal_port: 9205
x-runtipi:
  schema_version: 2
  overrides: []
